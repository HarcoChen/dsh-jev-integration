# DSH bundle layer for the shared Jev Runtime integration.
# The package entry point is loaded by the DSH runtime; this row only supplies
# deployment defaults. User/workspace/session overrides are managed by the
# integration endpoints and are never written to the host's global config.
- insert:
    - id: dsh-jev-integration
      name: dsh-jev-integration
      config:
        # Jev sends protected tool arguments to TypeSafe. Hosts must explicitly
        # enable this optional advisory layer after showing their privacy notice.
        enabled: false
        baseUrl: https://api.typesafe.ai/v1/systemone
        model: jev-latest
        timeoutMs: 2000
        advisoryTimeoutMs: 3500
        askThreshold: 0.5
        blockThreshold: 0.85
        guardedTools:
          - bash
          - pwsh
          - terminal
          - run_command
          - execute_command
          - run_code
          - write_to_file
          - replace_file_content
        loopGuard:
          enabled: false
          triggerThreshold: 2
          noProgressThreshold: 0.3
          pLoopThreshold: 0.6
          minConfidence: 0.5
          cooldownSteps: 3
          maxHistory: 8
          deferExactRepeats: true
          requestTimeoutMs: 3500
          include: []
          exclude: []
        resultShaper:
          enabled: false
          shapeTools:
            - bash
            - pwsh
            - terminal
            - run_command
            - execute_command
          thresholdChars: 8000
          maxPerTurn: 2
          keepKinds:
            - warning
            - failure
          minKindConfidence: 0.6
          maxClusters: 24
          sampleChars: 400
          requestTimeoutMs: 4000
        doneGate:
          enabled: false
          blockThreshold: 0.75
          minEvidenceItems: 1
          requestTimeoutMs: 3500
          maxClaimChars: 4000
          cooldownTurns: 1
